<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>掃描條碼</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 支援 QR Code + EAN-13/EAN-8/UPC 一維條碼 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0,0,0,.6);
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .5px;
    }
    #reader {
      width: 100%;
      max-width: 480px;
    }
    /* 覆蓋 html5-qrcode 預設樣式 */
    #reader video { border-radius: 0 !important; }
    #reader__scan_region { border: none !important; }

    .controls {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    #startBtn  { background: #06C755; color: white; }
    #manualBtn { background: #333; color: #ddd; }
    #manualInput {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      text-align: center;
      letter-spacing: 2px;
      display: none;
    }
    #manualInput::placeholder { color: #666; letter-spacing: normal; }
    #submitManual {
      background: #1a73e8;
      color: white;
      display: none;
    }
    #status {
      text-align: center;
      padding: 8px 20px;
      font-size: 14px;
      color: #aaa;
      min-height: 24px;
    }
    .success-msg {
      color: #06C755;
      font-size: 20px;
      text-align: center;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
<header>🔍 掃描食品 / 藥品條碼</header>
<div id="reader"></div>
<div id="status">請點擊「開始掃描」</div>

<div class="controls">
  <button id="startBtn" onclick="startScan()">📷 開始掃描</button>
  <button id="manualBtn" onclick="toggleManual()">✏️ 手動輸入條碼</button>
  <input id="manualInput" type="number" placeholder="輸入 EAN / UPC 條碼號碼" inputmode="numeric">
  <button id="submitManual" onclick="submitManual()">送出查詢</button>
</div>

<script>
  const LIFF_ID = "{{ liff_barcode_id }}";
  let scanner = null;
  let scanning = false;

  liff.init({ liffId: LIFF_ID }).catch(err => {
    setStatus('LIFF 初始化失敗：' + err.message);
  });

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  async function sendBarcode(value) {
    setStatus('✅ 掃描成功：' + value + '，查詢中...');
    try {
      await liff.sendMessages([{
        type: 'text',
        text: 'SCAN:' + value
      }]);
      document.querySelector('.controls').innerHTML =
        '<div class="success-msg">✅ 查詢請求已送出！</div>';
      setTimeout(() => liff.closeWindow(), 1800);
    } catch (e) {
      setStatus('傳送失敗：' + e.message);
    }
  }

  async function startScan() {
    if (scanning) return;
    scanning = true;
    document.getElementById('startBtn').textContent = '掃描中...';
    document.getElementById('startBtn').disabled = true;
    setStatus('請將條碼對準框框');

    scanner = new Html5Qrcode('reader');
    const config = {
      fps: 15,
      qrbox: { width: 280, height: 140 },
      aspectRatio: 1.7,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
      ]
    };

    try {
      await scanner.start({ facingMode: 'environment' }, config, async (decoded) => {
        await scanner.stop();
        await sendBarcode(decoded);
      });
    } catch (e) {
      setStatus('無法開啟相機：' + e + '，請使用手動輸入');
      scanning = false;
      document.getElementById('startBtn').textContent = '📷 開始掃描';
      document.getElementById('startBtn').disabled = false;
    }
  }

  function toggleManual() {
    const input = document.getElementById('manualInput');
    const submit = document.getElementById('submitManual');
    const visible = input.style.display === 'block';
    input.style.display = visible ? 'none' : 'block';
    submit.style.display = visible ? 'none' : 'block';
    if (!visible) input.focus();
  }

  async function submitManual() {
    const val = document.getElementById('manualInput').value.trim();
    if (!val) { setStatus('請輸入條碼號碼'); return; }
    await sendBarcode(val);
  }
</script>
</body>
</html>
